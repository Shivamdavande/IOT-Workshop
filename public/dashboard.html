<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SISTec IoT - Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
  <nav class="bg-blue-600 text-white p-4 shadow-lg">
    <div class="container mx-auto flex justify-between items-center">
      <h1 class="text-2xl font-bold">SISTec IoT Application 2026</h1>
      <div class="flex items-center gap-4">
        <span id="username" class="font-semibold"></span>
        <button
          onclick="logout()"
          class="bg-red-500 hover:bg-red-600 px-4 py-2 rounded-lg font-semibold transition"
        >
          Logout
        </button>
      </div>
    </div>
  </nav>

  <div class="container mx-auto p-6">
    <!-- Section 1: Latest Readings -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
      <div class="bg-white rounded-lg shadow-lg p-6">
        <h2 class="text-gray-600 text-sm font-semibold uppercase mb-4">Latest Temperature</h2>
        <div class="flex items-end gap-2">
          <p id="tempValue" class="text-5xl font-bold text-red-500">--</p>
          <span class="text-2xl text-gray-600 mb-1">°C</span>
        </div>
        <p id="tempTime" class="text-gray-500 text-sm mt-4">--:-- --</p>
        <p id="tempDate" class="text-gray-500 text-sm">--</p>
      </div>

      <div class="bg-white rounded-lg shadow-lg p-6">
        <h2 class="text-gray-600 text-sm font-semibold uppercase mb-4">Latest Humidity</h2>
        <div class="flex items-end gap-2">
          <p id="humidValue" class="text-5xl font-bold text-blue-500">--</p>
          <span class="text-2xl text-gray-600 mb-1">%</span>
        </div>
        <p id="humidTime" class="text-gray-500 text-sm mt-4">--:-- --</p>
        <p id="humidDate" class="text-gray-500 text-sm">--</p>
      </div>
    </div>

    <!-- Section 2: LCD Text Input -->
    <div class="bg-white rounded-lg shadow-lg p-6 mb-8">
      <h2 class="text-lg font-bold text-gray-800 mb-4">Send Text to LCD (Max 16 Characters)</h2>
      <div class="flex gap-2">
        <input
          type="text"
          id="lcdText"
          maxlength="16"
          class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="Enter text..."
        />
        <button
          onclick="sendLcdText()"
          class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-6 rounded-lg transition"
        >
          Submit
        </button>
      </div>
      <p id="lcdMessage" class="mt-2 text-sm hidden"></p>
    </div>

    <!-- Section 3: Historical Data Table -->
    <div class="bg-white rounded-lg shadow-lg p-6">
      <h2 class="text-lg font-bold text-gray-800 mb-4">Sensor Data Records</h2>
      <div class="overflow-x-auto">
        <table class="w-full border-collapse">
          <thead>
            <tr class="bg-blue-600 text-white">
              <th class="border border-gray-300 px-4 py-2 text-left">#</th>
              <th class="border border-gray-300 px-4 py-2 text-left">Temperature</th>
              <th class="border border-gray-300 px-4 py-2 text-left">Humidity</th>
              <th class="border border-gray-300 px-4 py-2 text-left">Time</th>
              <th class="border border-gray-300 px-4 py-2 text-left">Date</th>
              <th class="border border-gray-300 px-4 py-2 text-center">Action</th>
            </tr>
          </thead>
          <tbody id="dataTable">
            <tr>
              <td colspan="6" class="text-center py-4 text-gray-500">Loading...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    // Check authentication
    window.addEventListener('load', () => {
      const user = localStorage.getItem('user');
      if (!user) {
        window.location.href = 'index.html';
        return;
      }

      const userData = JSON.parse(user);
      document.getElementById('username').textContent = userData.name;

      loadLatestSensorData();
      loadAllSensorData();

      // Refresh data every 5 seconds
      setInterval(loadLatestSensorData, 5000);
      setInterval(loadAllSensorData, 5000);
    });

    function logout() {
      localStorage.removeItem('user');
      window.location.href = 'index.html';
    }

    async function loadLatestSensorData() {
      try {
        const response = await fetch('/api/sensor-latest');
        const data = await response.json();

        document.getElementById('tempValue').textContent = data.temperature || '--';
        document.getElementById('humidValue').textContent = data.humidity || '--';
        document.getElementById('tempTime').textContent = data.time || '--';
        document.getElementById('tempDate').textContent = data.date || '--';
        document.getElementById('humidTime').textContent = data.time || '--';
        document.getElementById('humidDate').textContent = data.date || '--';
      } catch (error) {
        console.error('Error loading latest data:', error);
      }
    }

    async function loadAllSensorData() {
      try {
        const response = await fetch('/api/sensor-data');
        const data = await response.json();

        const tableBody = document.getElementById('dataTable');
        tableBody.innerHTML = '';

        if (data.length === 0) {
          tableBody.innerHTML = '<tr><td colspan="6" class="text-center py-4 text-gray-500">No data available</td></tr>';
          return;
        }

        data.forEach((row, index) => {
          const tr = document.createElement('tr');
          tr.className = index % 2 === 0 ? 'bg-gray-50' : 'bg-white';
          tr.innerHTML = `
            <td class="border border-gray-300 px-4 py-2">${index + 1}</td>
            <td class="border border-gray-300 px-4 py-2">${row.temperature}°C</td>
            <td class="border border-gray-300 px-4 py-2">${row.humidity}%</td>
            <td class="border border-gray-300 px-4 py-2">${row.time}</td>
            <td class="border border-gray-300 px-4 py-2">${row.date}</td>
            <td class="border border-gray-300 px-4 py-2 text-center">
              <button
                onclick="deleteRecord(${row.id})"
                class="bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded text-sm transition"
              >
                Delete
              </button>
            </td>
          `;
          tableBody.appendChild(tr);
        });
      } catch (error) {
        console.error('Error loading sensor data:', error);
      }
    }

    async function sendLcdText() {
      const text = document.getElementById('lcdText').value;
      const messageDiv = document.getElementById('lcdMessage');

      if (!text.trim()) {
        messageDiv.textContent = 'Please enter text';
        messageDiv.className = 'mt-2 text-sm bg-yellow-100 text-yellow-700 p-2 rounded';
        messageDiv.classList.remove('hidden');
        return;
      }

      try {
        const response = await fetch('/api/lcd-text', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text }),
        });

        const data = await response.json();

        if (response.ok) {
          messageDiv.textContent = 'Text sent to LCD successfully!';
          messageDiv.className = 'mt-2 text-sm bg-green-100 text-green-700 p-2 rounded';
          document.getElementById('lcdText').value = '';
        } else {
          messageDiv.textContent = data.error || 'Failed to send text';
          messageDiv.className = 'mt-2 text-sm bg-red-100 text-red-700 p-2 rounded';
        }
      } catch (error) {
        messageDiv.textContent = 'Error: ' + error.message;
        messageDiv.className = 'mt-2 text-sm bg-red-100 text-red-700 p-2 rounded';
      }

      messageDiv.classList.remove('hidden');
      setTimeout(() => messageDiv.classList.add('hidden'), 3000);
    }

    async function deleteRecord(id) {
      if (!confirm('Delete this record?')) return;

      try {
        const response = await fetch(`/api/sensor/${id}`, {
          method: 'DELETE',
        });

        if (response.ok) {
          loadAllSensorData();
        } else {
          alert('Failed to delete record');
        }
      } catch (error) {
        alert('Error: ' + error.message);
      }
    }
  </script>
</body>
</html>
