<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SISTec IoT - Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-500 to-blue-700 min-h-screen flex items-center justify-center">
  <div class="bg-white rounded-lg shadow-2xl p-8 w-full max-w-md">
    <h1 class="text-3xl font-bold text-center text-blue-600 mb-2">SISTec IoT</h1>
    <p class="text-center text-gray-600 mb-8">Application 2026</p>

    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Email</label>
        <input
          type="email"
          id="email"
          required
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="your@email.com"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Password</label>
        <input
          type="password"
          id="password"
          required
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="••••••••"
        />
      </div>

      <button
        type="submit"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg transition"
      >
        Login
      </button>
    </form>

    <p class="text-center text-gray-600 mt-4">
      Don't have an account?
      <a href="register.html" class="text-blue-600 hover:underline font-semibold">Register here</a>
    </p>

    <div id="message" class="mt-4 p-3 rounded-lg hidden"></div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const messageDiv = document.getElementById('message');

      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });

        const data = await response.json();

        if (response.ok) {
          localStorage.setItem('user', JSON.stringify(data.user));
          messageDiv.textContent = 'Login successful! Redirecting...';
          messageDiv.className = 'mt-4 p-3 rounded-lg bg-green-100 text-green-700';
          setTimeout(() => (window.location.href = 'dashboard.html'), 1000);
        } else {
          messageDiv.textContent = data.error || 'Login failed';
          messageDiv.className = 'mt-4 p-3 rounded-lg bg-red-100 text-red-700';
        }
      } catch (error) {
        messageDiv.textContent = 'Error: ' + error.message;
        messageDiv.className = 'mt-4 p-3 rounded-lg bg-red-100 text-red-700';
      }
    });
  </script>
</body>
</html>
