<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | SISTec IoT 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body class="flex items-center justify-center min-h-screen">
    <div class="bg-animate"></div>
    <div class="bg-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>
    <div id="particles-js"></div>

    <div class="glass p-8 w-full max-w-md mx-4" data-aos="zoom-in" data-aos-duration="1000">
        <div class="text-center mb-8">
            <div class="w-20 h-20 bg-gradient-to-tr from-cyan-400 to-purple-600 rounded-2xl mx-auto mb-4 flex items-center justify-center shadow-lg shadow-cyan-500/20">
                <svg class="w-12 h-12 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                </svg>
            </div>
            <h1 class="text-3xl font-extrabold text-neon-blue mb-2">LOGIN</h1>
            <p class="text-gray-400">SISTec Smart IoT Dashboard 2026</p>
        </div>

        <form id="loginForm" class="space-y-6">
            <div>
                <label class="block text-gray-300 mb-2 text-sm uppercase tracking-widest">Email Address</label>
                <input type="email" id="email" required class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 focus:outline-none focus:border-cyan-400 text-white transition-all" placeholder="Enter your email">
            </div>
            <div>
                <label class="block text-gray-300 mb-2 text-sm uppercase tracking-widest">Password</label>
                <input type="password" id="password" required class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 focus:outline-none focus:border-cyan-400 text-white transition-all" placeholder="••••••••">
            </div>
            <button type="submit" class="btn-cyber w-full py-4 rounded-xl shadow-lg shadow-cyan-500/20">
                Sign In
            </button>
        </form>

        <p class="mt-8 text-center text-gray-400">
            Don't have an account? 
            <a href="register.html" class="text-cyan-400 hover:underline font-semibold">Register here</a>
        </p>
    </div>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="js/auth.js"></script>
    <script>
        AOS.init();
        particlesJS.load('particles-js', 'https://cdn.jsdelivr.net/gh/VincentGarreau/particles.js@master/demo/particles.json');
    </script>
</body>
</html>
