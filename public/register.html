<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | SISTec IoT 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
</head>
<body class="flex items-center justify-center min-h-screen">
    <div class="bg-animate"></div>
    <div class="bg-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>
    <div id="particles-js"></div>

    <div class="glass p-8 w-full max-w-md mx-4" data-aos="fade-up">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-extrabold text-neon-purple mb-2">REGISTER</h1>
            <p class="text-gray-400">Join the Future of IoT</p>
        </div>

        <form id="registerForm" class="space-y-5">
            <div>
                <label class="block text-gray-300 mb-2 text-sm uppercase">Full Name</label>
                <input type="text" id="name" required class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 focus:border-purple-400 text-white" placeholder="John Doe">
            </div>
            <div>
                <label class="block text-gray-300 mb-2 text-sm uppercase">Email Address</label>
                <input type="email" id="email" required class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 focus:border-purple-400 text-white" placeholder="john@example.com">
            </div>
            <div>
                <label class="block text-gray-300 mb-2 text-sm uppercase">Password</label>
                <input type="password" id="password" required class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 focus:border-purple-400 text-white" placeholder="••••••••">
            </div>
            <button type="submit" class="btn-cyber w-full py-4 rounded-xl shadow-lg shadow-purple-500/20" style="background: linear-gradient(45deg, #7000ff, #ff00f2)">
                Create Account
            </button>
        </form>

        <p class="mt-8 text-center text-gray-400">
            Already have an account? 
            <a href="index.html" class="text-purple-400 hover:underline font-semibold">Login here</a>
        </p>
    </div>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="js/auth.js"></script>
    <script>
        AOS.init();
        particlesJS.load('particles-js', 'https://cdn.jsdelivr.net/gh/VincentGarreau/particles.js@master/demo/particles.json');
    </script>
</body>
</html>
